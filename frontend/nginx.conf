server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to this one address; /api goes on to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Pages are chosen by the # part of the URL, so every other path is the app.
    location / {
        try_files $uri /index.html;
    }
}
